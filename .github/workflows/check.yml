name: Go checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go (${{ matrix.os }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        # The native and race suites run as separate jobs, each with its own
        # time budget and disk: one after the other they no longer fit the
        # Windows runner.
        suite: [native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      GOTOOLCHAIN: auto
      GOMAXPROCS: 2
      CGO_ENABLED: 1
      CHECK_REPO: ${{ github.repository }}
      CHECK_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact commit
        shell: pwsh
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "git config core.autocrlf failed" }
          git remote add origin "https://github.com/${env:CHECK_REPO}.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          git fetch --depth 1 origin "${env:CHECK_SHA}"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach "${env:CHECK_SHA}"
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
      - name: Resolve the native Go toolchain
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) { return }
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x64' }
          $toolcache = $env:RUNNER_TOOL_CACHE
          if (-not $toolcache) { $toolcache = $env:AGENT_TOOLSDIRECTORY }
          if (-not $toolcache) { throw "Go is not on PATH and the runner toolcache is unset" }
          $exe = if ($IsWindows) { 'go.exe' } else { 'go' }
          $bin = Get-ChildItem (Join-Path $toolcache 'go') -Directory |
            Where-Object { $_.Name -match '^1\.25\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "$arch/bin" } |
            Where-Object { Test-Path (Join-Path $_ $exe) } |
            Select-Object -First 1
          if (-not $bin) { throw "Go is not on PATH and a native Go 1.25 toolcache entry was not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Keep the Go build cache and the test temp on the work drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'go-build'
          $tmp = Join-Path $env:RUNNER_TEMP 'go-tmp'
          $testTmp = Join-Path $env:RUNNER_TEMP 'test-tmp'
          New-Item -ItemType Directory -Force -Path $cache, $tmp, $testTmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "GOCACHE=$cache"
          Add-Content -Path $env:GITHUB_ENV -Value "GOTMPDIR=$tmp"
          # t.TempDir and os.MkdirTemp follow TEMP and TMP, which default to
          # the system drive; the suite's temporary files fill it.
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$testTmp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$testTmp"
      - name: Free disk before the tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
      - name: Formatting and vet
        if: matrix.suite == 'native'
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed" }
          $formatting = @(gofmt -l $files)
          if ($LASTEXITCODE -ne 0 -or $formatting.Count -ne 0) { throw "gofmt failed: $formatting" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
      - name: Native tests
        if: matrix.suite == 'native'
        shell: pwsh
        run: |
          $samples = Join-Path $env:RUNNER_TEMP 'proc-samples.txt'
          $sampler = Start-Job -ArgumentList $samples -ScriptBlock {
            param($out)
            $t0 = Get-Date
            while ($true) {
              $os = Get-CimInstance Win32_OperatingSystem
              $pf = (Get-CimInstance Win32_PageFileUsage | Measure-Object -Property CurrentUsage -Sum).Sum
              $c = [math]::Round((Get-PSDrive C).Free/1GB,1)
              $top = Get-Process | Group-Object Name | Sort-Object Count -Descending | Select-Object -First 8 | ForEach-Object { "$($_.Name)=$($_.Count)" }
              $mem = Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 5 | ForEach-Object { "$($_.Name):$([math]::Round($_.WorkingSet64/1MB))MB" }
              "t=$([int]((Get-Date)-$t0).TotalSeconds) freeMemMB=$([math]::Round($os.FreePhysicalMemory/1KB)) pagefileMB=$pf C=$c procs=$((Get-Process).Count) | $($top -join ' ') | $($mem -join ' ')" | Add-Content $out
              Start-Sleep 60
            }
          }
          $json = Join-Path $env:RUNNER_TEMP 'test.json'
          go test -json -timeout=30m ./... > $json
          $rc = $LASTEXITCODE
          Stop-Job $sampler
          Get-Content $samples
          $events = Get-Content $json | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } | Where-Object { $_ -and $_.Test -and ($_.Action -eq 'pass' -or $_.Action -eq 'fail') -and $_.Test -notmatch '/' }
          $events | Sort-Object Elapsed -Descending | Select-Object -First 60 | ForEach-Object { "{0,8:N1}s {1} {2} {3}" -f $_.Elapsed, $_.Action, ($_.Package -replace '.*/internal/',''), $_.Test }
          Get-Content $json | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } | Where-Object { $_ -and -not $_.Test -and ($_.Action -eq 'pass' -or $_.Action -eq 'fail') } | ForEach-Object { "PKG {0,8:N1}s {1} {2}" -f $_.Elapsed, $_.Action, $_.Package }
          if ($rc -ne 0) { throw "go test failed" }
      - name: Race detector
        if: matrix.suite == 'race'
        shell: pwsh
        run: |
          go test -race -timeout=30m ./...
          if ($LASTEXITCODE -ne 0) { throw "go test -race failed" }
      - name: Free disk after the tests
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
